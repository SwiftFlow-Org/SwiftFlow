# CodeFlow — the SwiftFlow code editor, written in SwiftFlow.
#
# One file describing this app on every platform. Canonical values are
# lowered into each platform's own manifest at build time.
#
# Precedence, when a key is expressible in more than one place:
#   raw passthrough  >  [platform] typed  >  [app] canonical

[swiftflow]
# `dev` follows the framework working tree, which is what you want while
# the editor and the framework are being built against each other. Pin a
# release number once CodeFlow stops driving framework changes.
version = "dev"

[app]
id      = "com.swiftflow.codeflow"
name    = "CodeFlow"
version = "0.1.0"
build   = 1

[desktop]
bin = "codeflow"

[android]
# The editor is a desktop-shaped app; Android is here so the same source
# keeps proving it builds, not because a phone is a good place to edit
# code. Nothing in Sources/ is platform-conditional.
min_sdk = 28

[ios]
deployment_target = "17.0"
