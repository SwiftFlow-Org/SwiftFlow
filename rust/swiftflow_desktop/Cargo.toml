[package]
name = "swiftflow_desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "swiftflow_desktop"
# staticlib for the Swift executable to link; rlib so the crate's own
# tests can exercise the pure helpers; cdylib so the framework can be one
# dynamic image in a process (the preview host and a views dylib must share
# a single renderer — one wgpu, one NodeRegistry — rather than embed two
# copies of the static archive). cargo fully links the cdylib, honouring
# winit's and wgpu's own link directives directly.
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
swiftflow_core = { path = "../swiftflow_core" }
# Depended on as an rlib for `init_with_target` — the desktop host owns
# its window, so it never needs the C surface-descriptor path.
swiftflow_wgpu = { path = "../swiftflow_wgpu" }
winit = "0.30"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
# The tablet reader's event-monitor callback (src/pen.rs).
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# GetPointerPenInfo, for the tilt and eraser winit's touch events leave out.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
